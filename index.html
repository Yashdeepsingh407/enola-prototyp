<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENOLA – Messnetzverwaltung (UI-Konzept)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Corporate Design aus dem ENOLA-Original */
  --link:#1f7ea8; --link-dark:#16607f;
  --accent:#7b2a8c; --accent-soft:#f3e8f6;
  --head:#d7e8fc; --row-alt:#ebf4fd; --btn:#89c0f9; --btn-soft:#bcd0f5;
  --navy:#0b1a6b; --ink:#1c2430; --muted:#5f6b7a; --line:#dbe3ec; --bg:#f5f8fc; --card:#fff;
  --ok:#1a8f5c; --warn:#b7791f; --bad:#c0392b; --r:8px; --pad:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Sidebar */
aside{width:244px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;transition:width .2s;flex:none;height:100vh;position:sticky;top:0;overflow:auto}
aside.min{width:64px}
aside.min .lbl,aside.min .sub,aside.min .foot-t,aside.min .car{display:none}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:var(--navy);font-weight:300;font-size:22px;letter-spacing:.14em}
.logo svg{width:30px;height:30px}
.nav a,.nav button.n{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:6px;color:var(--link);background:none;border:0;cursor:pointer;text-align:left}
.nav a:hover,.nav button.n:hover{background:var(--row-alt)}
.nav a.on,.nav button.n.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav .car{margin-left:auto;transition:.15s}
.sub{margin:2px 0 6px 20px;padding-left:10px;border-left:2px solid var(--line)}
.sub a{padding:6px 10px;font-size:13px}
.spacer{flex:1}
.foot{border-top:1px solid var(--line);padding-top:8px}
.foot a{font-size:13px;color:var(--muted);padding:6px 10px}
.collapse{margin:6px 0 0 auto;background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px}
.collapse:hover{background:var(--row-alt)}

main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:auto}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.pill{display:flex;align-items:center;gap:8px;background:var(--row-alt);border:1px solid transparent;border-radius:var(--r);padding:7px 12px;cursor:pointer}
.pill:hover{border-color:var(--btn)}
.pill b{font-weight:500}
.gsearch{flex:1;max-width:520px;position:relative}
.gsearch input{width:100%;padding:8px 60px 8px 36px;border:1px solid var(--line);border-radius:var(--r);background:#fff;outline:0}
.gsearch input:focus,.field:focus{border-color:var(--link);box-shadow:0 0 0 3px #1f7ea826}
.gsearch .i{position:absolute;left:11px;top:9px;color:var(--muted)}
kbd{position:absolute;right:10px;top:8px;font:12px Roboto;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.ibtn{position:relative;background:none;border:0;padding:8px;border-radius:50%;cursor:pointer;color:var(--link);display:inline-grid;place-items:center}
.ibtn:hover{background:var(--row-alt)}
.dot{position:absolute;top:4px;right:3px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:15px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--link);color:#fff;display:grid;place-items:center;font-weight:500}
#burger{display:none}

.page{padding:24px;max-width:1380px;width:100%;margin:0 auto}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:500;color:var(--link)}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--row-alt);border-color:var(--btn)}
.btn.pri{background:var(--link);border-color:var(--link);color:#fff}
.btn.pri:hover{background:var(--link-dark)}
.btn.sm{padding:5px 10px;font-weight:400}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #0b1a6b0d}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:15px;font-weight:500}
.ch .r{margin-left:auto;display:flex;gap:8px}
.cb2{padding:16px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow:auto}
.tab{background:none;border:0;padding:13px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none;display:inline-block}
.tab:hover{color:var(--link)}
.tab.on{color:var(--accent);border-color:var(--accent);font-weight:500}
.tab small{background:var(--row-alt);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--link-dark)}
.tab.on small{background:var(--accent-soft);color:var(--accent)}

.tools{display:flex;gap:8px;padding:12px;align-items:center;flex-wrap:wrap}
.sfield{position:relative;flex:1;min-width:200px}
.sfield .i{position:absolute;left:10px;top:8px;color:var(--muted)}
.field{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;outline:0}
.sfield .field{padding-left:34px}
select.field{padding-right:26px}
.auto{width:auto}
.lbl2{display:block;font-weight:500;margin:0 0 5px;color:#23405f}
.fg{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--row-alt);border:1px solid var(--head);color:var(--link-dark);border-radius:16px;padding:3px 6px 3px 11px;font-size:13px}
.chip button{background:none;border:0;cursor:pointer;color:var(--link);padding:0 3px;font-size:15px;line-height:1}

.menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0b1a6b26;padding:6px;min-width:220px;max-height:70vh;overflow:auto}
.menu .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--link)}
.menu .it:hover,.menu .it.hl{background:var(--accent-soft);color:var(--accent)}
.menu .it.red{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu h6{margin:6px 10px 4px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu label{display:flex;gap:9px;padding:7px 10px;border-radius:6px;cursor:pointer;align-items:center}
.menu label:hover{background:var(--row-alt)}

.bulk{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:9px 14px;margin:0 12px 10px;border-radius:var(--r);flex-wrap:wrap}
.bulk .btn{background:#ffffff1f;border-color:#ffffff40;color:#fff}
.bulk .btn:hover{background:#ffffff38}
.bulk .x{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;font-size:18px}

.tw{overflow:auto;max-height:calc(100vh - 330px);min-height:200px;border-top:1px solid var(--line)}
.tw.emb{max-height:340px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-weight:500;padding:11px 12px;white-space:nowrap;cursor:pointer;user-select:none;color:#23405f}
th.nosort{cursor:default}
th .ar{opacity:.35;margin-left:4px;font-size:11px}
th.sorted .ar{opacity:1;color:var(--accent)}
td{padding:var(--pad) 12px;border-bottom:1px solid #edf1f6;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tbody tr:nth-child(even) td{background:#f8fbfe}
tbody tr:hover td{background:var(--row-alt)}
tbody tr.sel td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
.cb{appearance:none;width:18px;height:18px;border:1.5px solid #9aa8b8;border-radius:4px;background:#fff;cursor:pointer;display:inline-grid;place-items:center;margin:0;vertical-align:middle}
.cb:checked,.cb:indeterminate{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tag{display:inline-block;background:var(--row-alt);color:var(--link-dark);border-radius:5px;padding:2px 8px;font-size:12px;margin-right:4px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:2px 10px 2px 8px;font-size:12px;font-weight:500}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:#e3f5ec;color:var(--ok)}.b-warn{background:#fdf1dc;color:var(--warn)}.b-bad{background:#fbe5e2;color:var(--bad)}.b-mute{background:#eceff3;color:var(--muted)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--head);border-radius:0 0 12px 12px;color:#23405f;flex-wrap:wrap}
.pager .mid{margin:0 auto;display:flex;align-items:center;gap:8px}
.pager .btn{background:var(--btn);border-color:var(--btn)}
.pager .btn:disabled{opacity:.45}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.thumb{width:36px;height:36px;border-radius:6px;display:block}
.sub-t{display:inline-block;font-size:12px;margin-right:6px;padding:1px 7px;border-radius:5px;background:#eceff3;color:var(--muted)}
.sub-t.ok{background:#e3f5ec;color:var(--ok)}
.prog{display:inline-flex;align-items:center;gap:8px;min-width:120px}
.prog i{display:block;height:6px;width:70px;border-radius:3px;background:#e6ecf3;position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--link);border-radius:3px}
.prog.full i::after{background:var(--ok)}
.kpi.btn2{display:block;width:100%;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.kpi.btn2:hover,.kpi.btn2.on{border-color:var(--accent);box-shadow:0 4px 14px #7b2a8c1a}
.kpi.btn2.on{background:var(--accent-soft)}
.todo{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.todo:hover{border-color:var(--btn);background:var(--row-alt)}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.cmt{display:inline-flex;align-items:center;gap:6px;background:var(--row-alt);border:1px solid transparent;border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--link-dark);max-width:260px}
.cmt:hover{border-color:var(--accent);color:var(--accent)}
.cmt.empty{background:none;border:1px dashed var(--line);color:var(--muted)}
.cmt span{overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px}
.cmt svg{width:15px;height:15px}
.cm{display:flex;gap:10px;margin-bottom:12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--link);color:#fff;display:grid;place-items:center;font-weight:500;flex:none}
.cb3{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1;min-width:0;word-break:break-word}
.cmh{display:flex;gap:8px;align-items:baseline}.cmh .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pchip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;cursor:pointer}
.pchip:hover{border-color:var(--btn)}.pchip.on{background:var(--link);border-color:var(--link);color:#fff}
.mininav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;position:sticky;top:58px;z-index:10;background:var(--bg);padding:6px 0}
.mininav button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer;color:var(--link)}
.mininav button:hover{border-color:var(--accent);color:var(--accent)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:16px;margin-bottom:16px}
.sgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media(max-width:1000px){.sgrid,.sgrid2{grid-template-columns:1fr}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal button{aspect-ratio:1;border:0;border-radius:8px;padding:0;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.gal button:hover{outline:2px solid var(--accent)}
.frow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f6}
.frow:last-child{border:0}.frow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}.xbtn:hover{background:#fbe5e2;color:var(--bad)}
.kvedit{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;align-items:center}
.kvedit .field{padding:5px 8px}
.slim{padding:10px 16px}
.nbadge{display:inline-block;margin-left:auto;background:var(--row-alt);color:var(--link-dark);border-radius:10px;font-size:11px;padding:0 7px;line-height:18px;font-weight:500}
.nbadge.red{background:#fbe5e2;color:var(--bad);margin-left:4px}
.nbadge.in{margin-left:6px}
textarea.field{resize:vertical;min-height:70px}
.due-hint{display:block;font-size:12px;color:var(--muted)}
.due-hint.late{color:var(--bad)}

.scrim{position:fixed;inset:0;background:#0b1a6b40;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none;box-shadow:-10px 0 40px #0b1a6b30}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:20px;font-weight:500;color:var(--link)}
.db{padding:20px;overflow:auto;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.sec{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa .btn{justify-content:flex-start;color:var(--link)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}.kpi small{color:var(--muted)}.kpi b{display:block;font-size:24px;font-weight:500;margin-top:2px}
.kpi.l{border-left:4px solid var(--link)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sc{padding:18px;cursor:pointer;transition:.15s;display:flex;gap:14px;color:inherit}
.sc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px #7b2a8c1f}
.sc .ic{width:42px;height:42px;border-radius:10px;background:var(--row-alt);color:var(--link);display:grid;place-items:center;flex:none}
.sc b{display:block;margin-bottom:3px}.sc span{color:var(--muted);font-size:13px}
.drop{border:2px dashed var(--btn);background:var(--row-alt);border-radius:12px;padding:50px 20px;text-align:center;color:var(--muted)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);opacity:0;transition:.25s;z-index:80;pointer-events:none;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#89c0f9;font-weight:500;cursor:pointer}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
.mini{font-size:12px;color:var(--muted)}

/* Karte */
.mapw{position:relative;height:calc(100vh - 135px);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
#map{position:absolute;inset:0}
.ov{position:absolute;z-index:500;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0b1a6b22}
.ov-l{left:12px;top:12px;width:320px;max-height:calc(100% - 24px);display:flex;flex-direction:column}
.ov-r{right:12px;top:12px;width:320px;max-height:calc(100% - 24px);overflow:auto}
.ov-b{left:12px;bottom:12px;width:270px;padding:12px 14px}
.ov-b h6,.ov-r h6{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ov-b label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.ov-b .cnt{margin-left:auto;color:var(--muted)}
.sw{width:11px;height:11px;border-radius:50%;flex:none}
.res{padding:6px;overflow:auto}
.rc{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:4px;cursor:pointer}
.rc:hover{border-color:var(--accent);background:var(--accent-soft)}
.tools2{position:absolute;right:12px;bottom:92px;z-index:500;display:flex;flex-direction:column;gap:6px}
.tools2 .btn{width:40px;height:40px;padding:0;justify-content:center;box-shadow:0 4px 12px #0b1a6b22}

/* Charts */
.chart{width:100%;display:block}
.chart text{font:11px Roboto;fill:#5f6b7a}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center;padding:6px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tt{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px #0b1a6b26;border-radius:6px;padding:6px 10px;font-size:12px;z-index:5;display:none}
.cw{position:relative}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.two>.card{min-width:0}
@media(max-width:1000px){.two{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media(max-width:900px){
  aside{display:none;position:fixed;z-index:60;left:0;top:0;box-shadow:0 0 40px #0b1a6b40}
  aside.show{display:flex}
  #burger{display:inline-grid}
  .kpis{grid-template-columns:1fr 1fr}.top .pill span.h{display:none}
  .ov-l,.ov-r{width:calc(100% - 24px)}.ov-r{top:auto;bottom:12px;max-height:55%}.ov-b{display:none}
}
</style>
</head>
<body>
<aside id="side"></aside>
<main>
  <div class="top">
    <button class="ibtn" id="burger" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="pill" id="teamPill"><b>Team</b><span id="teamName"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>

/* =============== Diagramme (SVG) =============== */
function frame(w,h,x0,x1,y0,y1,{xt,yt,ylab=''}={}){
  const m={l:52,r:16,t:12,b:30},X=v=>m.l+(v-x0)/(x1-x0)*(w-m.l-m.r),Y=v=>h-m.b-(v-y0)/(y1-y0)*(h-m.t-m.b);
  let g='';for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6ecf3"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${nf(v,1)}</text>`}
  (xt||[]).forEach(([v,l])=>g+=`<text x="${X(v)}" y="${h-10}" text-anchor="middle">${l}</text>`);
  if(ylab)g+=`<text x="12" y="${m.t+4}" >${esc(ylab)}</text>`;
  return{X,Y,g,m};
}
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function series(id,years,par){
  const r=hrng(id+par),n=Math.round(years*52),t0=Date.now()-years*365*86400000,base=20+r()*14,amp=.4+r()*.8,trend=(r()-.6)*.25;
  return Array.from({length:n},(_,i)=>{const t=t0+i/n*years*365*86400000,y=i/n*years;const out=r()>.97;
    return{t,v:+(base+amp*Math.sin((y%1)*6.283-1.2)+trend*y+(r()-.5)*.35+(out?(r()>.5?1.6:-1.6):0)).toFixed(2),out}});
}
function reg(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p.t,0)/n,my=pts.reduce((a,p)=>a+p.v,0)/n;let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p.t-mx)*(p.v-my);sxx+=(p.t-mx)**2});const b=sxy/sxx;return{b,a:my-b*mx}}
function trendSVG(pts,unit,W=1000,H=340){
  const ts=pts.map(p=>p.t),vs=pts.map(p=>p.v),x0=Math.min(...ts),x1=Math.max(...ts),lo=Math.min(...vs),hi=Math.max(...vs),pad=(hi-lo)*.12||1;
  const y0=lo-pad,y1=hi+pad,yrs=(x1-x0)/(365*86400000),step=Math.max(1,Math.ceil(yrs/6));
  const xt=[];for(let y=new Date(x0).getFullYear()+1;y<=new Date(x1).getFullYear();y+=step)xt.push([+new Date(y,0,1),y]);
  const f=frame(W,H,x0,x1,y0,y1,{xt,ylab:unit}),rg=reg(pts);
  return{svg:`<svg class="chart" viewBox="0 0 ${W} ${H}">${f.g}
   <line x1="${f.X(x0)}" y1="${f.Y(rg.a+rg.b*x0)}" x2="${f.X(x1)}" y2="${f.Y(rg.a+rg.b*x1)}" stroke="#7b2a8c" stroke-width="2.5"/>
   ${pts.map(p=>p.out?`<path d="M${f.X(p.t)} ${f.Y(p.v)-6}l6 11h-12z" fill="#e8963a" stroke="#fff"/>`:`<circle cx="${f.X(p.t)}" cy="${f.Y(p.v)}" r="2.6" fill="#1f7ea8" opacity=".85"/>`).join('')}</svg>`,
   perYear:rg.b*365*86400000,outliers:pts.filter(p=>p.out).length};
}
function seasonalSVG(id,W=1000,H=360){
  const r=hrng(id+'sea'),base=30+r()*8,amp=.5+r()*.7,N=48;
  const f0=m=>base-amp*Math.cos((m/12)*6.283+.4),sp=[ ['max',1.5],['p90',.95],['p75',.5],['p25',-.5],['p10',-.95],['min',-1.5] ];
  const xs=Array.from({length:N+1},(_,i)=>i/N*12),bound=k=>xs.map(m=>f0(m)+sp.find(s=>s[0]==k)[1]+Math.sin(m*1.3)*.05);
  const y0=Math.min(...bound('min'))-.22,y1=Math.max(...bound('max'))+.22,f=frame(W,H,0,12,y0,y1,{xt:MON.map((m,i)=>[i+.5,m])});

function dualChart(pts,rohr,unit,W=820,H=300){

  const X=v=>m.l+(v-x0)/(x1-x0||1)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  let g='';for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6ecf3"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${nf(v,1)}</text>`+(rohr!=null?`<text x="${W-m.r+8}" y="${Y(v)+4}">${nf(rohr-v,1)}</text>`:'')}
  const yrs=(x1-x0)/(365*864e5);for(let k=0;k<=4;k++){const t=x0+(x1-x0)*k/4;g+=`<text x="${X(t)}" y="${H-10}" text-anchor="${k==0?'start':k==4?'end':'middle'}">${yrs>2?new Date(t).getFullYear():fmtD(new Date(t))}</text>`}
  g+=`<text x="${m.l-8}" y="10" text-anchor="end">${esc(unit)}</text>`+(rohr!=null?`<text x="${W-m.r+8}" y="10">m u. MP</text>`:'');

  return{svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" id="dsvg">${g}<path d="${line}L${X(x1)} ${H-m.b}L${X(x0)} ${H-m.b}Z" fill="#1f7ea822"/><path d="${line}" fill="none" stroke="#1f7ea8" stroke-width="2"/>
    ${pts.filter(p=>p.user).map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="#7b2a8c" stroke="#fff" stroke-width="1.5"/>`).join('')}
    <line id="dcur" y1="${m.t}" y2="${H-m.b}" stroke="#7b2a8c" stroke-dasharray="3 3" style="display:none"/><circle id="ddot" r="5" fill="#7b2a8c" stroke="#fff" stroke-width="2" style="display:none"/>
    <rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="dhit"/></svg>`,X,Y,W,H,m,x0,x1}

    ${gw?`<div class="card kpi"><small>Trend pro Jahr</small><b style="${tr==null?'':tr>=0?'color:var(--ok)':'color:var(--bad)'}">${tr==null?'—':(tr>=0?'+':'')+nf(tr)+' m'}</b></div>`:`<div class="card kpi"><small>Min – Max</small><b>${pts.length?nf(Math.min(...pts.map(p=>p.v)),1)+' – '+nf(Math.max(...pts.map(p=>p.v)),1)+' °C':'—'}</b></div>`}

   <div class="mapw"><div id="map"></div>
    <div class="ov ov-l"><div class="tools" style="padding:10px"><div class="sfield">${ic('search')}<input class="field" id="ms" placeholder="ID, Name oder Messprogramm"></div></div><div class="res" id="mres"></div></div>
    <div class="ov ov-r" id="msel" style="display:none"></div>
    <div class="ov ov-b"><h6>Hintergrundkarte</h6>${[['grau','TopPlusOpen grau'],['farbe','TopPlusOpen Farbe'],['osm','OpenStreetMap']].map(([k,l],i)=>`<label><input type="radio" name="bm" value="${k}" ${i==0?'checked':''}>${l}</label>`).join('')}
     <h6 style="margin-top:10px">Datensätze</h6>${DS.map(([l,f],i)=>`<label><input type="checkbox" class="cb" data-ds="${i}" checked><span class="sw" style="background:${DS[i][2]}"></span>${l}<span class="cnt">${STATIONS.filter(f).filter(visible).length}</span></label>`).join('')}</div>
    <div class="tools2"><button class="btn" id="zall" title="Alle anzeigen" aria-label="Alle anzeigen">${ic('expand')}</button><button class="btn" id="loc" title="Mein Standort" aria-label="Mein Standort">${ic('target')}</button></div></div></div>`;
  map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([52.52,13.4],11);L.control.zoom({position:'bottomright'}).addTo(map);
  let bl=baseLayer('grau').addTo(map);
  $$('[name=bm]').forEach(r=>r.onchange=()=>{map.removeLayer(bl);bl=baseLayer(r.value).addTo(map);bl.bringToBack()});
  const groups=DS.map(([l,f,dc])=>{const g=L.layerGroup();STATIONS.filter(f).filter(visible).forEach(s=>L.circleMarker([s.lat,s.lng],{radius:STATIONS.length>300?5:7,color:'#fff',weight:1,fillColor:dc,fillOpacity:.95}).bindTooltip(s.name).on('click',()=>select(s.id)).addTo(g));return g.addTo(map)});
  $$('[data-ds]').forEach(c=>c.onchange=()=>c.checked?groups[+c.dataset.ds].addTo(map):map.removeLayer(groups[+c.dataset.ds]));
  const fill=q=>{const r=STATIONS.filter(visible).filter(s=>(s.id+s.name+s.progs.join()).toLowerCase().includes(q.toLowerCase()));
    $('#mres').innerHTML=`<div class="mini" style="padding:2px 8px 4px">Ergebnisse (${r.length})</div>`+r.slice(0,50).map(s=>`<div class="rc" data-id="${esc(s.id)}"><b style="font-weight:500">${esc(s.name)}</b> <span class="mini">${esc(s.id)}</span><div class="mini">${esc(s.typ)} · ${esc(s.src)}</div></div>`).join('');
    $$('.rc').forEach(c=>c.onclick=()=>select(c.dataset.id))};
  function select(id){const s=stById(id);S.mapSel=id;map.flyTo([s.lat,s.lng],15);const el=$('#msel');el.style.display='block';
    const kv=[['Name',s.name],['Rohrkante',s.rohr?nf(s.rohr)+' m NHN':'—'],['Geländehöhe',nf(s.gel)+' m NHN'],['Filterbereich',s.filter],['Betreiber',s.betreiber],['Messprogramm',s.progs.join(', ')||'—'],['Grundwasserleiter',s.aq],['Datenquelle',s.quelle]];
    el.innerHTML=`<div class="ch"><h3>Ausgewählte Messstelle</h3><div class="r"><button class="ibtn" id="mx" style="padding:4px" aria-label="Schließen">${ic('x')}</button></div></div><div class="cb2"><dl class="kv" style="grid-template-columns:110px 1fr;font-size:13px">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
     <div style="display:grid;gap:8px;margin-top:14px"><button class="btn pri block" id="mt">${ic('trend')}Trendanalyse</button><button class="btn block" id="mz">Zur Messstelle</button><button class="btn block" id="msn">Zur saisonalen Statistik</button></div></div>`;
    $('#mx').onclick=()=>el.style.display='none';$('#mt').onclick=()=>{S.trendSt=id;location.hash='viz/trend'};$('#mz').onclick=()=>location.hash='station/'+id;$('#msn').onclick=()=>{S.trendSt=id;location.hash='viz/saisonal'}}
  fill('');$('#ms').oninput=e=>fill(e.target.value);
  $('#zall').onclick=()=>map.flyTo([52.52,13.4],11);
  $('#loc').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.flyTo([p.coords.latitude,p.coords.longitude],14),()=>toast('Standort nicht verfügbar')):toast('Standort nicht verfügbar');
  if(S.mapSel&&stById(S.mapSel))select(S.mapSel);
}
const stub=t=>()=>{$('#view').innerHTML=`<div class="page"><div class="ph"><div><h1>${t}</h1></div></div><div class="card"><div class="empty">Diese Seite ist noch nicht Teil des UI-Konzepts.</div></div></div>`};

/* =============== Navigation =============== */
const NAV=[
 {k:'karten',t:'Karten',i:'map'},
 {k:'viz',t:'Visualisierungen',i:'chart',sub:[['viz/saisonal','Saisonale Statistik'],['viz/trend','Trend-Analyse'],['viz/vergleich','Messstellenvergleich']]},
 {k:'messnetz',t:'Messnetzverwaltung',i:'ruler',sub:[['messnetz','Übersicht'],['messstellen','Messstellen'],['messwerte','Messwerte'],['programme','Messprogramme'],['fotos','Fotos'],['dateien','Dateien'],['ausruestung','Beobachtungsausrüstung'],['methoden','Beobachtungsmethoden'],['aufgaben','Aufgaben'],['einstellungen','Einstellungen'],['import','Import']]},
 {k:'nutzer',t:'Nutzerverwaltung',i:'users'},{k:'notif',t:'Benachrichtigungen',i:'bell'}];
const inGroup=(g,r)=>g.sub&&g.sub.some(s=>s[0]==r||(r.startsWith('station/')&&s[0]=='messstellen')||(s[0]=='einstellungen'&&r.startsWith('einstellungen/')));
function renderSide(){
  const r=S.route;$('#side').className=(S.side?'min':'')+($('#side').classList.contains('show')?' show':'');
  $('#side').innerHTML=`<div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="#1f7ea8" stroke-width="2.2"><circle cx="16" cy="16" r="12"/><path d="M7 20c5-10 13-10 18-6" stroke="#0b1a6b"/><path d="M9 25c8-2 13-6 15-12" stroke="#89c0f9"/></svg><span class="lbl">ENOLA</span></div>
   <nav class="nav">${NAV.map(g=>{if(!g.sub)return `<a href="#${g.k}" class="${r==g.k?'on':''}" title="${g.t}">${ic(g.i)}<span class="lbl">${g.t}</span></a>`;
     const on=inGroup(g,r),open=S.groups[g.k]??on;
     return `<button class="n ${on?'on':''}" data-g="${g.k}" title="${g.t}">${ic(g.i)}<span class="lbl">${g.t}</span>${g.k=='messnetz'?'<span id="tbg"></span>':''}<span class="car" style="transform:rotate(${open?90:0}deg)">${ic('chev')}</span></button>${open?`<div class="sub">${g.sub.map(([k,l])=>`<a href="#${k}" class="${r==k||(k=='messstellen'&&r.startsWith('station/'))||(k=='einstellungen'&&r.startsWith('einstellungen/'))?'on':''}">${l}${k=='aufgaben'?`<span id="tb" style="margin-left:auto">${taskBadge()}</span>`:''}</a>`).join('')}</div>`:''}`}).join('')}</nav><div class="spacer"></div>
   <div class="foot nav"><a href="#hilfe" title="Hilfe">${ic('help')}<span class="foot-t">Hilfe</span></a><a href="#kontakt" title="Kontakt">${ic('mail')}<span class="foot-t">Kontakt</span></a><a href="#sicherheit" title="Sicherheit &amp; Datenschutz">${ic('shield')}<span class="foot-t">Sicherheit &amp; Datenschutz</span></a><a href="#abmelden" title="Abmelden">${ic('out')}<span class="foot-t">Abmelden</span></a></div>
   <button class="collapse" id="col" aria-label="Seitenleiste ein-/ausklappen">${ic(S.side?'chev':'left')}</button>`;
  $('#col').onclick=()=>{S.side=!S.side;renderSide()};
  $$('[data-g]',$('#side')).forEach(b=>b.onclick=()=>{const g=NAV.find(x=>x.k==b.dataset.g);S.groups[g.k]=!(S.groups[g.k]??inGroup(g,S.route));renderSide()});
  $$('a',$('#side')).forEach(a=>a.addEventListener('click',()=>$('#side').classList.remove('show')));
}
$('#burger').onclick=()=>{$('#side').classList.toggle('show')};
$('#teamPill').onclick=e=>showMenu(e.currentTarget,TEAMS.map((t,i)=>`<div class="it" data-k="${i}">${t}${i==S.team?' ✓':''}</div>`).join(''),k=>{S.team=+k;$('#teamName').textContent=TEAMS[S.team];toast('Team gewechselt: '+TEAMS[S.team]);route()});
$('#teamName').textContent=TEAMS[0];
$('#bell').onclick=()=>location.hash='notif';

/* Globale Suche: Seiten + Messstellen */
const PAGES=[['karten','Karten'],['viz/saisonal','Saisonale Statistik'],['viz/trend','Trend-Analyse'],['viz/vergleich','Messstellenvergleich'],['messstellen','Messstellen'],['messwerte','Messwerte'],['programme','Messprogramme'],['fotos','Fotos'],['dateien','Dateien'],['ausruestung','Beobachtungsausrüstung'],['methoden','Beobachtungsmethoden'],['aufgaben','Aufgaben'],['einstellungen','Einstellungen'],['import','Import']];
const gs=$('#gs');let gsItems=[];
function gsUpdate(){const q=gs.value.trim().toLowerCase();if(!q){closeMenu();return}
  gsItems=PAGES.filter(p=>p[1].toLowerCase().includes(q)).map(p=>({l:p[1],s:'Seite',h:p[0]})).concat(STATIONS.filter(visible).filter(s=>(s.id+s.name).toLowerCase().includes(q)).slice(0,6).map(s=>({l:s.name+' ('+s.id+')',s:'Messstelle',h:'station/'+s.id}))).slice(0,9);
  const m=showMenu(gs,gsItems.length?gsItems.map((x,i)=>`<div class="it ${i?'':'hl'}" data-k="${i}"><span style="flex:1">${esc(x.l)}</span><span class="mini">${x.s}</span></div>`).join(''):'<div class="hint" style="padding:8px 10px">Keine Treffer</div>',k=>{location.hash=gsItems[+k].h;gs.value='';gs.blur()});
  m.style.minWidth=gs.offsetWidth+'px'}
gs.addEventListener('input',gsUpdate);
gs.addEventListener('keydown',e=>{if(e.key=='Enter'&&gsItems.length&&gs.value.trim()){location.hash=gsItems[0].h;gs.value='';closeMenu();gs.blur()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key=='k'){e.preventDefault();gs.focus()}if(e.key=='Escape'){closeMenu();closeDrawer()}});

/* =============== Router =============== */
const info=(t,body,crumb='')=>()=>{$('#view').innerHTML=`<div class="page" style="max-width:860px">${crumb?`<div class="crumb">${crumb}</div>`:''}<div class="ph"><div><h1>${t}</h1></div></div>${body}</div>`};
const FAQ=[['Wie importiere ich Messstellen oder Messwerte?','Unter Messnetz → Import eine CSV-Datei hochladen. Eine Vorlage mit den passenden Spalten kannst du dort herunterladen.'],['Woher kommen die Messstellen und Wetterdaten?','Die Grundwassermessstellen kommen aus dem Geodatenportal Berlin (SenMVKU, Lizenz dl-zero-de/2.0), die Wetterdaten vom Deutschen Wetterdienst (CC BY 4.0) über Bright Sky.'],['Warum sind manche Diagramme Beispieldaten?','Die offene Berliner Quelle enthält nur Standorte der Grundwassermessstellen, keine Zeitreihen. Eigene Messwerte kannst du per Import oder Formular ergänzen.'],['Wie vergleiche ich Messstellen?','In der Messstellenliste mehrere Zeilen markieren und „Vergleichen“ wählen, oder unter Visualisierungen → Messstellenvergleich bis zu 15 Messstellen auswählen.'],['Kann ich Listen exportieren?','Ja, jede Liste hat oben „Exportieren“ (aktuelle Filter) und in der Aktionsleiste den Export der Auswahl als CSV.']];
const PAGES2={
 hilfe:info('Hilfe',`<div class="card">${FAQ.map(([q,a])=>`<details style="padding:14px 18px;border-bottom:1px solid var(--line)"><summary style="cursor:pointer;font-weight:500">${q}</summary><p class="hint" style="margin:10px 0 0">${a}</p></details>`).join('')}</div>`),
 kontakt:info('Kontakt',`<div class="card cb2"><p>Fragen, Feedback oder Wünsche zur Software?</p><p><a class="btn pri" href="mailto:kontakt@hydro-berlin.de">${ic('mail')}E-Mail schreiben</a></p><p class="hint">Hydro-Berlin GmbH · kontakt@hydro-berlin.de</p></div>`),
 sicherheit:info('Sicherheit & Datenschutz',`<div class="card cb2"><h3 style="margin-top:0">Datenschutz</h3><p class="hint">Dieses UI-Konzept speichert nichts auf einem Server. Importierte oder erfasste Daten bleiben im Browser und sind nach dem Neuladen wieder weg.</p>
   <h3>Externe Dienste</h3><ul class="hint"><li>Geodatenportal Berlin (WFS) – Messstellen</li><li>Bright Sky / Deutscher Wetterdienst – Wetterdaten</li><li>BKG TopPlusOpen und OpenStreetMap – Kartenkacheln</li></ul>
   <p class="hint">Bei jedem Seitenaufruf werden diese Dienste direkt aus deinem Browser abgefragt; dabei sieht der jeweilige Anbieter deine IP-Adresse.</p></div>`),
 abmelden:info('Abgemeldet',`<div class="card cb2"><p>Du wurdest abgemeldet (Demo).</p><a class="btn pri" href="#messstellen">Wieder anmelden</a></div>`)
};
const ROUTES={
 messstellen:()=>listPage('stations','Messstellen','',{actions:[{label:'Karte',icon:'map',fn:()=>location.hash='karten'}]}),
 suche:()=>listPage('stations','Messstellen','',{}),
 messwerte:()=>listPage('values','Messwerte','<p class="mini" style="margin-top:2px">Grundwassermessdaten verwalten</p>'),
 programme:()=>listPage('programme','Messprogramme',''),fotos:()=>listPage('fotos','Fotos',''),dateien:()=>listPage('dateien','Dateien',''),
 ausruestung:()=>listPage('ausruestung','Beobachtungsausrüstung',''),methoden:()=>listPage('methoden','Beobachtungsmethoden',''),aufgaben:()=>listPage('aufgaben','Aufgaben',''),
 messnetz:viewHub,einstellungen:viewSettings,import:viewImport,karten:viewMap,
 'viz/trend':viewTrend,'viz/saisonal':viewSeasonal,'viz/vergleich':viewCompare,viz:()=>location.hash='viz/saisonal',
 nutzer:()=>listPage('users','Nutzerverwaltung','',{crumb:'Verwaltung'}),notif:()=>listPage('notifs','Benachrichtigungen','',{crumb:'Verwaltung'}),
 ...PAGES2};
[['parameter','Parameter'],['parameterlisten','Parameterlisten'],['aliase','Parameter-Aliase'],['beurteilung','Beurteilungswerte'],['beurteilungslisten','Beurteilungswertelisten'],['einheiten','Einheiten'],['pruefregeln','Prüfregeln'],['aufgabentypen','Aufgabentypen']]
 .forEach(([k,t])=>ROUTES['einstellungen/'+k]=()=>listPage(k,t,'',{crumb:'<a href="#einstellungen">Einstellungen</a>'}));
function route(){closeMenu();closeDrawer();if(map){map.remove();map=null}MAPS.splice(0).forEach(m=>m.remove());
  let h=location.hash.slice(1)||'messstellen';S.route=h;
  renderSide();updBell();
  if(h.startsWith('station/'))viewStation(decodeURIComponent(h.slice(8)));
  else if(ROUTES[h])ROUTES[h]();else{S.route='messstellen';ROUTES.messstellen()}
  $('main').scrollTop=0}
addEventListener('hashchange',route);
(async function boot(){
  $('#view').innerHTML='<div class="page"><div class="empty">Lade Live-Daten (GDI Berlin, DWD) …</div></div>';renderSide();
  try{await loadLive();setLive(true)}catch(e){console.warn('Live-Daten nicht verfügbar:',e);setLive(false)}
  route();
})();
</script>
